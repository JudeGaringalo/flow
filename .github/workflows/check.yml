name: Check FLOW
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Once package-lock.json is committed, switch npm install to npm ci.
      - run: npm install
      - run: npm run check
